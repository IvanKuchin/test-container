name: Release

on:
  release:
    types: ['published']

permissions:
  contents: write
  deployments: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create or Update Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view ${{ github.ref_name }} &>/dev/null; then
            gh release create ${{ github.ref_name }} --draft --verify-tag --title ${{ github.ref_name }}
          fi

  deploy:
    name: Deploy Container
    needs: [create-release]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      packages: write
      deployments: write
    steps:
      - uses: actions/checkout@v7

      - name: Set Variables
        id: vars
        run: |
          echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT
          echo "REPO_NAME=${GITHUB_REPOSITORY#*/}" >> $GITHUB_OUTPUT
          echo "RELEASE_NUM=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          echo "REPO_LOWER=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT


      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          build-args: |
            BUILD_DATE=${{ steps.vars.outputs.BUILD_DATE }}
            BUILD_VERSION=${{ github.sha }}
          tags: |
            ghcr.io/${{ steps.vars.outputs.REPO_LOWER }}:${{ github.ref_name }}
            ghcr.io/${{ steps.vars.outputs.REPO_LOWER }}:latest
